services:
  - type: web
    name: vhs-club
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TMDB_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OMDB_KEY
        sync: false
      - key: NODE_VERSION
        value: 22
